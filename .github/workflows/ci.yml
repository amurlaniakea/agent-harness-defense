name: ci
on:
  push:
    branches: ["**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks scans the diff of the push; a shallow clone breaks that
          # with 'fatal: ambiguous argument ... ^..HEAD'. See github-licencia
          # skill note on gitleaks-action.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev extras
        run: |
          python -m venv .venv
          . .venv/bin/activate
          pip install -e ".[dev]"
      - name: ruff check
        run: . .venv/bin/activate && ruff check .
      - name: ruff format check
        run: . .venv/bin/activate && ruff format --check .
      - name: pytest
        run: . .venv/bin/activate && pytest
      - name: bandit (Medium+ only; Low is skipped via pyproject.toml)
        run: . .venv/bin/activate && bandit -r agent_harness_defense -ll
      - name: gitleaks (binary; not a pip package)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
